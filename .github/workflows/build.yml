name: Build and push

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if this upstream commit was already built (e.g. after changing WEB_DEFAULT_API or the Dockerfile)"
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cobalt-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest cobalt commit
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/imputnet/cobalt.git refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check if this commit was already built
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:${{ steps.upstream.outputs.sha }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repo (Dockerfile)
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v5

      - name: Checkout upstream cobalt source
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          repository: imputnet/cobalt
          ref: ${{ steps.upstream.outputs.sha }}
          path: cobalt-src

      - name: Copy our Dockerfile and entrypoint into the build context
        if: steps.check.outputs.skip == 'false'
        run: |
          cp Dockerfile cobalt-src/Dockerfile
          cp -r docker-entrypoint.d cobalt-src/docker-entrypoint.d

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: cobalt-src
          file: cobalt-src/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
